<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>피자 매장 실적 분석 — 시사점과 통계 근거</title>
<style>

  html,body{height:100%;background:#2A2A2A;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:var(--ink)}
  #viewport{position:fixed;inset:0;overflow:hidden}
  #stage{position:absolute;left:50%;top:calc(50% - 22px);width:1280px;height:720px;transform-origin:center center}

  .slide.active{display:block}
  .s2{padding:40px 56px 0}

  .s2 .rule{height:3px;width:64px;background:var(--purple);margin:8px 0 14px}
  .s2 .body{display:flex;gap:28px;height:492px}
  .s2 .col{flex:none}.s2 .grow{flex:1;min-width:0}
  .s2 .stack{display:flex;flex-direction:column;gap:10px}
  .s2 .box{background:var(--panel);padding:11px 15px;border-left:4px solid var(--purple)}
  .s2 .box h3{font-size:13px;font-weight:800;color:var(--purple);margin-bottom:5px}
  .s2 .box p,.s2 .box li{font-size:13.5px;line-height:1.5;color:var(--ink2)}
  .s2 .box ul{padding-left:17px}.s2 .box li{margin-bottom:3px}
  .s2 .box b{color:var(--ink)}
  .s2 .warn{background:#FFF4E5;border-color:#C58A00}.s2 .warn h3{color:#9A6A00}
  .s2 .footer{position:absolute;left:56px;right:56px;bottom:16px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:7px}
  .s2 .chart-title{font-size:13.5px;font-weight:700;margin-bottom:3px}
  .small{font-size:12px;color:var(--mute)}
  .badge{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:3px;color:#fff;margin-right:6px;vertical-align:1px;white-space:nowrap}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  .s2 table{border-collapse:collapse;width:100%;font-size:12.5px}
  .s2 th{background:var(--purple);color:#fff;text-align:left;padding:7px 9px;font-weight:700;font-size:12px}
  .s2 td{padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.4;color:var(--ink2)}
  .s2 td b{color:var(--ink)} .s2 td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.click{cursor:pointer}tr.click:hover td{background:#F3ECFC}
  .btn{border:1px solid var(--purple);color:var(--purple);background:#fff;padding:5px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;border-radius:3px}
  .btn:hover{background:var(--purple);color:#fff}
  .xref{position:absolute;right:56px;top:36px;z-index:3}
  .cover .go{margin-top:30px;font-size:15px;padding:8px 18px}
  #kgbox{position:relative;border:1px solid var(--line);background:#FCFCFD;width:790px;height:392px}
  #kg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}#kg.drag{cursor:grabbing}
  #side{width:350px;height:492px;border:1px solid var(--line);padding:11px 14px;overflow:auto;font-size:12.5px}

  .ctl label{cursor:pointer;white-space:nowrap}
  .kv td{padding:3px 5px;font-size:12px}.kv td:first-child{color:var(--mute);white-space:nowrap;width:40%}
  .tip{position:absolute;pointer-events:none;background:rgba(30,30,30,.92);color:#fff;font-size:12px;padding:4px 8px;border-radius:3px;display:none;z-index:5;max-width:260px}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;margin-top:5px;width:790px;line-height:1.3}
  #nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;color:#bbb;font-size:13px;z-index:9;white-space:nowrap}
  #nav button{background:#444;color:#eee;border:0;padding:6px 14px;border-radius:3px;cursor:pointer;font-family:inherit}
  #nav button:hover{background:var(--purple)}
  @media print{
    @page{size:1280px 720px;margin:0}
    html,body{background:#fff;height:auto}
    #viewport{position:static}
    #stage{transform:none!important;position:static;width:1280px;height:auto}
    .slide{display:block!important;position:relative;height:720px;page-break-after:always;break-after:page}
    #nav,.xref{display:none}
  }

/* ---- original deck styles ---- */

const SL = []; const IDX = {}; const OLD_SLIDES = "<section class=\"slide cover\">\n  <div class=\"band\"><\/div>\n  <div class=\"in\">\n    <h1>피자 프랜차이즈 9개 매장 실적 분석<br>경영진을 위한 시사점 5가지<\/h1>\n    <p class=\"sub\">2020년 1월 ~ 2026년 8월 월별 실적(가상 데이터) 기준<br>매출은 늘었지만, 주문과 이익은 제자리에 있다<\/p>\n  <\/div>\n  <div class=\"meta\">분석 대상: 매출데이터 738개 매장·월 · 사건로그 39건과 대조 · 작성일 2026-10-30<\/div>\n<\/section>\n<section class=\"slide\">\n  <div class=\"tracker\">요약<\/div>\n  <h1 class=\"title\">성장은 객단가가 끌어왔고, 이익률은 인건비에 눌려 있으며, 매장 간 이익률 차이는 임차료가 만든다<\/h1>\n  <div class=\"rule\"><\/div>\n  <div>\n    <div class=\"sumrow\"><div class=\"num\">1<\/div><div><div class=\"t\">매출 +17%(2022→2025)는 전부 객단가 덕분이고, 주문 건수는 −1.2%다<\/div><div class=\"d\">주문 37.0만 건(2022) → 36.6만 건(2025). 신규고객수와 재방문율(53%)도 4년째 정체.<\/div><\/div><\/div>\n    <div class=\"sumrow\"><div class=\"num\">2<\/div><div><div class=\"t\">이익률은 17~18%에 갇혀 있고, 원인은 인건비율 상승(27.1% → 29.0%)이다<\/div><div class=\"d\">식자재비율(31%)과 플랫폼수수료율(7%)은 평탄. 사건로그의 치즈 단가 인상 영향은 데이터에서 확인되지 않는다.<\/div><\/div><\/div>\n    <div class=\"sumrow\"><div class=\"num\">3<\/div><div><div class=\"t\">자사앱이 주문의 31%까지 커졌지만 외부 배달앱 주문은 그대로이고, 쿠폰 비용이 플랫폼 수수료보다 크다<\/div><div class=\"d\">외부앱 주문 연 약 16만 건 유지. 2025년 쿠폰 9.6억 원 vs 플랫폼 수수료 7.7억 원.<\/div><\/div><\/div>\n    <div class=\"sumrow\"><div class=\"num\">4<\/div><div><div class=\"t\">큰 매장일수록 이익률이 낮은 이유는 운영이 아니라 임차료다<\/div><div class=\"d\">대형 3곳 − 소형 3곳 이익률 차 −2.25%p 중 임차료율이 +2.21%p. 규모 점수와 이익률 r=−0.94(순열검정 p=0.0003).<\/div><\/div><\/div>\n    <div class=\"sumrow\"><div class=\"num\">5<\/div><div><div class=\"t\">위생 B등급이 전체 매장·월의 절반이고, 이익과 무관해 방치되기 쉽다<\/div><div class=\"d\">연동 75%, 충장로 68% vs 강남 20%. 매장 간 차이는 확실하지만 월 단위 연속성은 없다(자기상관 0.03).<\/div><\/div><\/div>\n  <\/div>\n  <div class=\"footer\"><span>출처: 피자 매장별 실적 데이터.xlsx (매장·월 단위로 중복 제거 후 집계)<\/span><span>2<\/span><\/div>\n<\/section>\n<section class=\"slide\">\n  <div class=\"tracker\">시사점 1 / 5 · 성장의 질<\/div>\n  <h1 class=\"title\">매출 성장은 객단가가 만들었고, 주문 건수는 2022년 이후 제자리다<\/h1>\n  <div class=\"rule\"><\/div>\n  <div class=\"body\">\n    <div class=\"chartcol\">\n      <div class=\"chart-title\">연도별 총 주문 건수(천 건)와 객단가(만 원)<\/div>\n      <div class=\"chart-sub\">객단가 = 매출합 ÷ 총주문건수<\/div>\n      <div id=\"c1\"><\/div>\n    <\/div>\n    <div class=\"side\">\n      <div class=\"box\"><h3>무슨 일이 있었나<\/h3>\n        <ul>\n          <li>연 매출: 70.1억(2020) → 93.5억(2022) → <b>109.5억(2025)<\/b><\/li>\n          <li>2022→2025: 매출 <b>+17.1%<\/b> = 객단가 <b>+18.6%<\/b> × 주문 <b>−1.2%<\/b><\/li>\n          <li>신규고객수는 월 평균 398명(2022) → 383명(2025), 재방문율은 53%로 고정<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"box\"><h3>그래서<\/h3>\n        <p>가격·구성 효과가 이미 한 번 반영됐다. 2026년 1~8월은 전년 동기 대비 <b>매출 +5.9%, 주문 +2.4%<\/b>로, 객단가 상승 여력은 줄어드는 신호다. 다음 성장은 <b>주문 건수와 신규 유입<\/b>에서 나와야 한다.<\/p>\n      <\/div>\n      <div class=\"box\"><h3>근거 수준<\/h3><p><span class=\"tag ok\">데이터 확인<\/span>주문·객단가·매출은 정의대로 재계산된 값이다. 객단가가 오른 이유(가격 인상, 세트 구성)는 데이터만으로는 구분할 수 없다.<\/p><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer\"><span>출처: 매출데이터(실적 구분). 2026년은 1~8월만 있어 연도 비교에서 제외<\/span><span>3<\/span><\/div>\n<\/section>\n<section class=\"slide\">\n  <div class=\"tracker\">시사점 2 / 5 · 수익성<\/div>\n  <h1 class=\"title\">이익률은 17~18%에 묶여 있다 — 인건비가 매출보다 빨리 올랐기 때문이다<\/h1>\n  <div class=\"rule\"><\/div>\n  <div class=\"body\">\n    <div class=\"chartcol\">\n      <div class=\"chart-title\">매출 대비 비용 비율과 영업이익률(%)<\/div>\n      <div class=\"chart-sub\">매출합 대비 비율, 전 매장 합계. 2026*은 1~8월<\/div>\n      <div id=\"c2\"><\/div>\n    <\/div>\n    <div class=\"side\">\n      <div class=\"box\"><h3>무슨 일이 있었나<\/h3>\n        <ul>\n          <li>매장당 월 인건비 2,347만 → 3,007만 원(<b>+28%<\/b>), 월 매출은 +20%<\/li>\n          <li>인원은 거의 그대로(정규직 3.4명, 파트타임 6.5명) → <b>1인당 비용 상승<\/b><\/li>\n          <li>임차료율 4.3% → 3.8%가 인건비 부담 일부를 상쇄<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"box\"><h3>사건로그 가설 검증<\/h3>\n        <ul>\n          <li><span class=\"tag no\">데이터 불일치<\/span>치즈 단가 +6%(EV-026, 미확인): 안정 구간(6~8월) 식자재비율 −0.11%p [−0.40, +0.19]. 가정(치즈=식자재비 25%) 시 기대 +0.47%p는 구간 밖<\/li>\n          <li><span class=\"tag est\">부분 확인<\/span>배민 수수료 인상(EV-024): 수수료율은 변화 없음(0.00%p), 앱 주문 1건당 수수료만 4,602원 → 4,876원(<b>+6%<\/b>)<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"box\"><h3>그래서<\/h3><p>원가·수수료가 아니라 <b>인력 운영 효율<\/b>이 이익률의 핵심 변수다. 매장별 인건비율 관리가 먼저다.<\/p><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer\"><span>출처: 매출데이터(실적), 사건로그, 공급사마스터. 영업이익은 쿠폰 등 기타 항목이 반영돼 비용 6항목 합과 정확히 맞지 않음<\/span><span>4<\/span><\/div>\n<\/section>\n<section class=\"slide\">\n  <div class=\"tracker\">시사점 3 / 5 · 채널<\/div>\n  <h1 class=\"title\">자사앱이 주문의 31%까지 컸지만 외부 배달앱 의존은 그대로이고, 쿠폰이 수수료보다 크다<\/h1>\n  <div class=\"rule\"><\/div>\n  <div class=\"body\">\n    <div class=\"chartcol\">\n      <div style=\"display:flex;gap:20px\">\n        <div style=\"width:360px\"><div class=\"chart-title\">자사앱 주문 비중(%)<\/div><div id=\"c3a\"><\/div><\/div>\n        <div style=\"width:360px\"><div class=\"chart-title\">외부 배달앱 3사 주문수(천 건)<\/div><div id=\"c3b\"><\/div><\/div>\n      <\/div>\n      <div class=\"chart-title\" style=\"margin-top:6px\">쿠폰 할인 금액 vs 플랫폼 수수료(억 원/년)<\/div>\n      <div id=\"c3c\"><\/div>\n    <\/div>\n    <div class=\"side\">\n      <div class=\"box\"><h3>무슨 일이 있었나<\/h3>\n        <ul>\n          <li>자사앱 비중 5.6%(2020) → 13.8%(2022) → <b>31.4%(2026*)<\/b><\/li>\n          <li>배민·쿠팡이츠·요기요 주문은 연 <b>약 16만 건<\/b>으로 고정, 배민 비중도 56%로 동일<\/li>\n          <li>쿠폰은 2021년부터 플랫폼 수수료를 추월, 2025년 <b>1.24배<\/b><\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"box\"><h3>그래서<\/h3>\n        <p>자사앱은 외부앱 주문을 대체하지 못하고 <b>홀·포장 주문에 얹혔다<\/b>. 앱 성장 자체를 성과로 보기보다, 쿠폰 대비 재방문·객단가 효과를 따로 봐야 한다.<\/p>\n      <\/div>\n      <div class=\"box\"><h3>해석 주의<\/h3><p><span class=\"tag est\">추정<\/span>쿠폰이 매출에서 이미 차감됐는지는 데이터 정의에 없다. 쿠폰 금액과 이익률의 상관도 +0.06으로 약하다.<\/p><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer\"><span>출처: 매출데이터(실적), 플랫폼마스터. 2026*은 1~8월, 외부앱 주문수는 연 합계<\/span><span>5<\/span><\/div>\n<\/section>\n<section class=\"slide\">\n  <div class=\"tracker\">시사점 4 / 5 · 매장 간 차이<\/div>\n  <h1 class=\"title\">큰 매장일수록 이익률이 낮은 이유는 운영이 아니라 임차료다<\/h1>\n  <div class=\"rule\"><\/div>\n  <div class=\"body\">\n    <div class=\"chartcol\">\n      <div class=\"chart-title\">매장별 임차료율과 영업이익률(%) — 2020~2025 및 2026-06~08 평균<\/div>\n      <div class=\"chart-sub\">점 옆 숫자는 월 평균 매출(억 원). 선은 최소제곱 직선(기울기 −0.96)<\/div>\n      <div id=\"c4\"><\/div>\n    <\/div>\n    <div class=\"side\">\n      <div class=\"box\"><h3>무슨 일이 있었나 <span class=\"tag ok\">통계 확인<\/span><\/h3>\n        <ul>\n          <li>규모·품질 축(면적·좌석·주문·인원·QSC·위생·리뷰, 분산 94.6%)과 이익률 <b>r=−0.94<\/b> (순열검정 p=0.0003)<\/li>\n          <li>대형 3곳(강남·홍대·서면) − 소형 3곳(둔산·충장로·연동) 이익률 차 <b>−2.25%p<\/b> 중 임차료율 <b>+2.21%p<\/b><\/li>\n          <li>인건비·식자재·수수료율 차이는 ±0.2%p 이내<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"box\"><h3>그래서<\/h3>\n        <p>큰 매장은 QSC·위생도 오히려 우수하다. 이익률 격차는 <b>상권 비용(임차료)<\/b>이 만든 것이라, 운영 개선 대상이 아니라 <b>수익 구조<\/b>(객단가·임차 조건) 문제다.<\/p>\n      <\/div>\n      <div class=\"box\" style=\"border-color:#C58A00;background:#FFF4E5\"><h3 style=\"color:#9A6A00\">정정<\/h3>\n        <p>이전 버전의 \"2026년 매장 간 격차 2.6 → 7.8%p 확대, 서면·부평 상승\"은 <b>노이즈<\/b>로 확인됐다. 2026년 1~5월(월 평균 환산 구간)은 변동성이 평소의 약 2.4배였고, 매장 평균 SD 2.42는 우연 기대치 2.35와 구분되지 않는다(p=0.44).<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer\"><span>출처: 매출데이터(실적), 안정 구간만 사용. 상세 검정은 '온톨로지·지식그래프 원인 분석' 문서. N=9 매장<\/span><span>6<\/span><\/div>\n<\/section>\n<section class=\"slide\">\n  <div class=\"tracker\">시사점 5 / 5 · 운영 품질<\/div>\n  <h1 class=\"title\">위생 B등급이 매장·월의 절반이고, 이익과 무관해서 놓치기 쉬운 리스크다<\/h1>\n  <div class=\"rule\"><\/div>\n  <div class=\"body\">\n    <div class=\"chartcol\">\n      <div class=\"chart-title\">위생검사 B등급 비중(%) — 2020-01~2026-08, 매장당 80개월<\/div>\n      <div class=\"chart-sub\">전체 평균 50.4%(363 / 720개월)<\/div>\n      <div id=\"c5\"><\/div>\n    <\/div>\n    <div class=\"side\">\n      <div class=\"box\"><h3>무슨 일이 있었나<\/h3>\n        <ul>\n          <li>연동 <b>75%<\/b>, 충장로 <b>68%<\/b>가 B등급 최다, 가장 낮은 강남도 20%. 매장 간 차이는 통계적으로 확실(χ²=84, p&lt;1e-14)<\/li>\n          <li>그러나 한 매장 안에서 월별 <b>연속성은 없다<\/b>(자기상관 0.03): 매달 독립적으로 발생하고 확률만 매장마다 다르다<\/li>\n          <li>QSC·위생과 이익률의 월 단위 상관은 <b>−0.05<\/b>, 즉 손익 지표에 안 잡힌다<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"box\"><h3>규모·품질 축<\/h3>\n        <p>작은 매장일수록 QSC·위생이 낮다(적재 0.99~1.00). 정규직·QSC의 +0.35는 <b>매장 간 규모 차이<\/b>에서 나온 상관이고, 한 매장의 월별 변동에서는 <b>−0.01<\/b>(p=0.87)로 관계가 없다.<\/p>\n      <\/div>\n      <div class=\"box\"><h3>그래서<\/h3><p>위생·QSC는 이익으로 보상되지 않아 놓치기 쉽다. 대응은 월 연속 기록이 아니라 <b>B등급 비중이 높은 매장(연동·충장로)의 점검 체계<\/b> 개선이다.<\/p><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer\"><span>출처: 매출데이터(실적), 사건로그(EV-011·014·017), 데이터사전. 위생검사 결과는 A/B 두 등급만 존재<\/span><span>7<\/span><\/div>\n<\/section>\n<section class=\"slide\">\n  <div class=\"tracker\">제안<\/div>\n  <h1 class=\"title\">다음 분기에는 주문 건수, 인건비율, 쿠폰 효율, 임차료 부담 매장, 위생 지표를 관리 대상으로 올린다<\/h1>\n  <div class=\"rule\"><\/div>\n  <table>\n    <tr><th style=\"width:26%\">시사점<\/th><th style=\"width:44%\">제안 액션<\/th><th>확인할 지표<\/th><\/tr>\n    <tr><td><b>1<\/b> 주문 정체<\/td><td>성장 목표를 매출에서 <b>주문 건수·신규고객수<\/b>로 전환. 재방문율 53% 정체 구간을 겨냥한 프로그램 설계<\/td><td>월 주문수, 신규고객수, 재방문율<\/td><\/tr>\n    <tr><td><b>2<\/b> 인건비율<\/td><td>매장별 인건비율 상한 설정, 정규직 전환 지원금(EV-030)의 비용·QSC 효과 분기 점검. 치즈 단가는 2026-09 이후 계속 추적<\/td><td>인건비율, 식자재비율<\/td><\/tr>\n    <tr><td><b>3<\/b> 쿠폰·채널<\/td><td>쿠폰 대비 재방문·객단가 효과 측정 후 쿠폰 구조 재설계. 자사앱 비중 대신 <b>외부앱 주문의 자사앱 전환<\/b>을 목표로<\/td><td>쿠폰/매출, 외부앱 주문수<\/td><\/tr>\n    <tr><td><b>4<\/b> 매장 간 이익률 차이<\/td><td>대형 매장(강남·홍대·서면)은 운영 개선보다 <b>임차 조건·객단가·메뉴 믹스<\/b>로 수익 구조 점검. 점주 승계 후 QSC·이익률이 가장 낮은 충장로는 SV 집중 지원(부분 지지)<\/td><td>임차료율, 객단가, 충장로 QSC<\/td><\/tr>\n    <tr><td><b>5<\/b> 위생 B등급<\/td><td>B등급 <b>비중<\/b>이 높은 연동·충장로의 점검 체크리스트와 SV 방문 주기 개선. 월 연속 기록은 근거가 없어 관리 지표에서 제외<\/td><td>매장별 B등급 비중, QSC 85점 미만 월 수<\/td><\/tr>\n  <\/table>\n  <p style=\"margin-top:14px;font-size:13px;color:var(--mute)\">위 액션은 데이터에서 도출한 제안이며, 실행 비용과 효과는 별도 검증이 필요하다.<\/p>\n  <div class=\"footer\"><span>출처: 위 분석 종합<\/span><span>8<\/span><\/div>\n<\/section>\n<section class=\"slide\">\n  <div class=\"tracker\">부록<\/div>\n  <h1 class=\"title\">데이터 처리 방식과 해석상 한계<\/h1>\n  <div class=\"rule\"><\/div>\n  <div style=\"display:flex;gap:32px\">\n    <div class=\"box\" style=\"flex:1\"><h3>처리 방식<\/h3>\n      <ul>\n        <li>한 매장·월이 매출카테고리 6행으로 나뉘어 있어, 매장·월 단위 지표는 <b>6행 중복을 제거<\/b>한 뒤 집계 (738개 매장·월)<\/li>\n        <li>매출액만 카테고리 합산, 비율은 주문건수 가중 평균<\/li>\n        <li>구분이 <b>실적<\/b>인 2020-01~2026-08만 사용. 2026-09~10 <b>추정치 108행은 제외<\/b><\/li>\n        <li>사건로그는 <b>확인<\/b> 항목만 원인으로 쓰고, 추정·미확인은 데이터로 따로 검증<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"box\" style=\"flex:1\"><h3>한계<\/h3>\n      <ul>\n        <li>2026년 1~5월 값은 월 평균 환산치(소수 포함)이고, 2026년은 8개월치라 연도 비교는 같은 기간끼리만 함<\/li>\n        <li>손익 잔차: 매출 − 비용 6항목 − 영업이익이 467건에서 매출의 5%를 넘음. 쿠폰 등 기타 항목 때문으로 보이며 비용 구조 해석에 주의<\/li>\n        <li>가상 데이터라 절대 수치보다 <b>추세와 상대 비교<\/b>에 의미를 둠<\/li>\n        <li>상관계수는 매장·월 738건 기준이며 인과를 뜻하지 않음<\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n  <div class=\"footer\"><span>출처: 안내·데이터사전·정합성점검·변경이력 시트<\/span><span>9<\/span><\/div>\n<\/section>"; const OLDN = 9; const BASE = OLDN + 1;

function kgInit(){

  const links=DATA.links.filter(l=>idm[l.s]&&idm[l.t]).map(l=>({...l,a:idm[l.s],b:idm[l.t]}));
  const SW=1000,SH=620,ring={issue:60,factor:100,metric:165,store:245,event:305,region:335,sv:335,supplier:285,platform:285,menu:285};
  const byT={}; nodes.forEach(n=>{(byT[n.type]=byT[n.type]||[]).push(n);});
  Object.entries(byT).forEach(([t,L])=>L.forEach((n,k)=>{const ang=(k/L.length)*6.283+({issue:0,factor:1,metric:.3,store:.6,event:.1,region:2,sv:3,supplier:4,platform:5,menu:1.5}[t]||0),r=ring[t]||250;n.x=SW/2+Math.cos(ang)*r;n.y=SH/2+Math.sin(ang)*r*.78;n.vx=n.vy=0;}));

  function tick(alpha){

    links.forEach(l=>{const dx=l.b.x-l.a.x,dy=l.b.y-l.a.y,d=Math.sqrt(dx*dx+dy*dy)||1,k=(d-(rest[l.kind]||70))*(str[l.kind]||.03)*alpha,fx=dx/d*k,fy=dy/d*k;l.a.vx+=fx;l.a.vy+=fy;l.b.vx-=fx;l.b.vy-=fy;});

}
function fitNodes(ns){ const x0=Math.min(...ns.map(n=>n.x)),x1=Math.max(...ns.map(n=>n.x)),y0=Math.min(...ns.map(n=>n.y)),y1=Math.max(...ns.map(n=>n.y));
  const s=Math.max(.5,Math.min(2.6,Math.min(KG.W/(x1-x0+80),KG.H/(y1-y0+80)))); KG.scale=s; KG.tx=KG.W/2-(x0+x1)/2*s; KG.ty=KG.H/2-(y0+y1)/2*s; }
function kgStart(){ if(!KG){ kgInit(); kgBind(); } kgDraw(); }
function kgBind(){

  const world=e=>{const p=pt(e);return {x:(p.x-KG.tx)/KG.scale,y:(p.y-KG.ty)/KG.scale};};
  svg.addEventListener('wheel',e=>{e.preventDefault();const p=pt(e),f=e.deltaY<0?1.15:1/1.15,ns=Math.max(.4,Math.min(5,KG.scale*f));KG.tx=p.x-(p.x-KG.tx)*ns/KG.scale;KG.ty=p.y-(p.y-KG.ty)*ns/KG.scale;KG.scale=ns;kgDraw();},{passive:false});

function selectNode(id){
  KG.sel=id; const n=KG.idm[id],t=NT[n.type]; let h=`<h4><span class="dot" style="background:${t.c}"></span>${esc(n.type==='issue'?n.id:n.label)}</h4><p class="small">${t.l}${n.tier?` · ${badge(n.tier)}`:''}</p>`;

      (iss.rejected.length?`<h4 style="margin-top:10px;font-size:12.5px">기각·보류</h4>`+iss.rejected.map(r=>`<div style="margin:4px 0">✕ ${esc(r.h)}<br><span class="small">${esc(r.why)}</span></div>`).join(''):'')+`<p style="margin-top:8px"><button class="btn" onclick="go(IDX['issue${iss.id}'])">근거 슬라이드 ▸</button></p>`; }
  if(n.note) h+=`<p style="margin:7px 0;padding:7px;background:#F6F6F7"><b>검정 결과</b><br>${esc(n.note)}</p>`;
  if(n.text) h+=`<p style="margin:7px 0" class="small"><b>사건 서술</b><br>${esc(n.text)}</p>`;
  if(n.attrs&&n.type!=='issue') h+=`<table class="kv">${Object.entries(n.attrs).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>`;
  const rel=KG.links.filter(l=>l.a.id===id||l.b.id===id).filter(l=>l.kind!=='struct'||n.type==='store').filter(l=>!(n.type==='issue'&&l.kind==='evidence'));
  if(rel.length) h+=`<h4 style="margin-top:10px;font-size:12.5px">연결 (${rel.length})</h4>`+rel.slice(0,40).map(l=>{const o=l.a.id===id?l.b:l.a,dir=l.a.id===id?'→':'←';return `<div style="margin:4px 0;cursor:pointer" onclick="selectNode('${o.id}')">${l.tier?dot(l.tier):'<span class="dot" style="background:#CFCFD6"></span>'}<b>${dir} ${esc(l.rel)}</b> ${esc(o.type==='issue'?o.id:o.label)}${l.text?`<br><span class="small">${esc(l.text)}</span>`:''}</div>`;}).join('');
  $('side').innerHTML=h; kgDraw();
}
